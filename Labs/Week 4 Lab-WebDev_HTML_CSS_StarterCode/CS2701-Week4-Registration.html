<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fresh Food For All</title>
    <link rel="stylesheet" href="CS2701-Week4-Registration.css">
</head>

<body>

    <header></header>

    <!-- Navigation Menu -->
    <nav>
        <ul class="navlist">
            <li><a href="#">Home</a></li>
            <li><a href="#registration">Register</a></li>
            <li><a href="#">Login</a></li>
            <li><a href="#">Help</a></li>
        </ul>
    </nav>

    <main>

        <!-- Sidebar -->
        <aside>
            <input
                type="search"
                class="search"
                id="search"
                placeholder="Search..."
                aria-label="Search"
            >
        </aside>

        <!-- Registration Section -->
        <section id="registration">

            <form class="center" id="registrationForm">

                <h2>Register</h2>

                <label for="name">Name:</label>
                <input
                    type="text"
                    id="name"
                    name="name"
                    class="textInput"
                    required
                >

                <label for="email">Email:</label>
                <input
                    type="email"
                    id="email"
                    name="email"
                    class="textInput"
                    required
                >

                <label for="password">Password:</label>
                <input
                    type="password"
                    id="password"
                    name="password"
                    class="textInput"
                    minlength="8"
                    required
                >

                <label for="confirmPassword">
                    Re-type Password:
                </label>
                <input
                    type="password"
                    id="confirmPassword"
                    name="confirmPassword"
                    class="textInput"
                    minlength="8"
                    required
                >

                <div class="checkboxGroup">

                    <input
                        type="checkbox"
                        id="buyer"
                        name="buyer"
                        value="buyer"
                    >
                    <label for="buyer">
                        I want to buy produce directly from allotment owners.
                    </label>

                    <br>

                    <input
                        type="checkbox"
                        id="seller"
                        name="seller"
                        value="seller"
                    >
                    <label for="seller">
                        I want to sell produce from my allotment.
                    </label>

                    <br><br>

                    <input
                        type="checkbox"
                        id="terms"
                        name="terms"
                        required
                    >
                    <label for="terms">
                        I agree to the
                        <a href="#termsInformation">Terms of Use</a>
                        and
                        <a href="#termsInformation">Privacy Policy</a>.
                    </label>

                </div>

                <button type="submit">
                    Register
                </button>

                <p>
                    <a href="#termsInformation">Learn more</a>
                </p>

            </form>

            <div class="center" id="hiddenSection" hidden>
                <p id="hiddenParagraph"></p>
            </div>

            <p id="termsInformation" class="information">
                This is a demonstration registration page
                created for the CS2701 Week 4 Lab.
                No account information is stored or submitted.
            </p>

        </section>

    </main>

    <script>
        const form = document.getElementById("registrationForm");
        const messageSection = document.getElementById("hiddenSection");
        const message = document.getElementById("hiddenParagraph");

        form.addEventListener("submit", function(event) {
            event.preventDefault();

            const password = document.getElementById("password").value;
            const confirmPassword =
                document.getElementById("confirmPassword").value;

            messageSection.hidden = false;

            if (password !== confirmPassword) {
                message.textContent = "Passwords do not match.";
                messageSection.className = "center error";
                return;
            }

            message.textContent =
                "Registration form validated successfully! " +
                "This is a demonstration; no account was created.";

            messageSection.className = "center success";
        });
    </script>

</body>
</html>
